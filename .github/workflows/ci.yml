name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mindsplosion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Tests on SQLite
        run: pnpm test
      - name: Migrate PostgreSQL
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mindsplosion_test
      - name: Tests on PostgreSQL
        run: pnpm test
        env:
          MINDSPLOSION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mindsplosion_test

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (and smoke test) the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mindsplosion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name ms -p 3000:3000 \
            -e NODE_ENV=development -e JWT_SECRET="$(openssl rand -base64 32)" mindsplosion:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:3000/health && exit 0
            sleep 1
          done
          docker logs ms
          exit 1
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jsilvanus/mindsplosion:latest
            ghcr.io/jsilvanus/mindsplosion:${{ github.sha }}
          cache-from: type=gha
